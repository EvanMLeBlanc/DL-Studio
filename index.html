<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#002FAF">
  <title>DL Studio · Distribution lists made simple</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true"><span>s</span></div>
        <div><span class="brand-wordmark">slalom</span><strong>DL Studio</strong></div>
      </div>
      <div class="sidebar-label">WORKSPACE</div>
      <nav id="nav" class="nav-list" aria-label="Studio pages"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><span class="note-spark">✦</span><div><strong>DL Studio by Slalom.</strong><p>Create, manage, join, and leave lists in one place.</p></div></div>
        <a class="sidebar-help" id="help-link" href="https://help.slalom.com" target="_blank" rel="noopener noreferrer">? <span>Need help?</span><span aria-hidden="true">↗</span></a>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menu-button" aria-label="Open menu" aria-expanded="false" type="button">☰</button>
        <div class="breadcrumb"><span class="topbar-wordmark">slalom</span><span class="crumb-workspace">Workspace</span><span class="crumb-arrow">›</span><strong id="page-title">Home</strong></div>
        <div class="top-actions"><span class="mode-pill" id="mode-pill"></span><div class="profile" id="profile"></div></div>
      </header>
      <main id="view" class="content" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
</body>
</html>
